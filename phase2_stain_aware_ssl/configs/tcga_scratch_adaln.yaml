SEED: 42
RUN_ROOT: /home/work/workspace/nahcooy/stain/phase2_stain_aware_ssl/runs
RUN_NAME: tcga_scratch_adaln_v1
DEVICE: cuda:0

DATA:
  TRAIN_DIR: /path/to/tcga_patches/train
  VAL_DIR: /path/to/tcga_patches/val
  STAIN_VECTOR_DIR: /path/to/tcga_stain_vectors
  STAIN_INDEX_CSV: null
  REQUIRE_STAIN_VECTOR: true
  STAIN_DIM: 256
  RECURSIVE: true
  EXTENSIONS: [".png"]

DATALOADER:
  TRAIN_BATCH_SIZE: 64
  VAL_BATCH_SIZE: 64
  NUM_WORKERS: 8
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 4

AUG:
  N_GLOBAL_CROPS: 2
  N_LOCAL_CROPS: 0
  GLOBAL_CROP_SIZE: 224
  LOCAL_CROP_SIZE: 96
  GLOBAL_CROPS_SCALE: [0.32, 1.0]
  LOCAL_CROPS_SCALE: [0.05, 0.32]
  H_FLIP_P: 0.5
  V_FLIP_P: 0.5
  COLOR_JITTER_P: 0.8
  COLOR_JITTER_BRIGHTNESS: 0.3
  COLOR_JITTER_CONTRAST: 0.3
  COLOR_JITTER_SATURATION: 0.2
  COLOR_JITTER_HUE: 0.05
  GRAYSCALE_P: 0.2
  BLUR_GLOBAL1_P: 1.0
  BLUR_GLOBAL2_P: 0.1
  BLUR_LOCAL_P: 0.5
  BLUR_RADIUS_MIN: 0.1
  BLUR_RADIUS_MAX: 2.0
  SOLARIZE_P: 0.2
  SOLARIZE_THRESHOLD: 128

MODEL:
  TRAIN_MODE: scratch
  TORCH_COMPILE: false
  BACKBONE:
    TIMM_NAME: vit_large_patch16_224
    IMAGE_SIZE: 224
    DYNAMIC_IMG_SIZE: true
    PRETRAINED: false
    UNI_SOURCE: null
  CONDITIONING:
    METHOD: adaln
    HIDDEN_DIM: 512
    DROPOUT: 0.1
    PROMPT_TOKENS: 4
    PROMPT_DEPTH: 0
    CROSS_ATTN_HEADS: 8
  DINO:
    OUT_DIM: 8192
    HEAD_HIDDEN_DIM: 2048
    HEAD_BOTTLENECK_DIM: 256
    HEAD_NLAYERS: 3

TRAIN:
  EPOCHS: 100
  STEPS_PER_EPOCH: null
  BASE_LR: 2.0e-4
  MIN_LR: 1.0e-6
  WARMUP_START_LR: 1.0e-6
  WEIGHT_DECAY: 0.04
  WEIGHT_DECAY_END: 0.2
  BETAS: [0.9, 0.999]
  EPS: 1.0e-8
  WARMUP_EPOCHS: 10
  CLIP_GRAD_NORM: 3.0
  EMA_MOMENTUM_START: 0.996
  EMA_MOMENTUM_END: 1.0
  TEACHER_TEMP_START: 0.04
  TEACHER_TEMP_END: 0.07
  TEACHER_TEMP_WARMUP_EPOCHS: 20
  STUDENT_TEMP: 0.1
  CENTER_MOMENTUM: 0.9

AMP:
  USE_AMP: true
  DTYPE: bf16

LOG_EVERY_N_STEPS: 20
SAVE_EVERY_N_EPOCHS: 5
VAL_MAX_STEPS: 200
RESUME_PATH: null

EVAL:
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: true
  PERSISTENT_WORKERS: false
  PREFETCH_FACTOR: 2
  LABEL_MODE: parent_dir
  KNN_K: 20
  LINEAR_PROBE_C: 1.0

